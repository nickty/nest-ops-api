version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: nest_ops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    ports: ["3000:3000"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: nest_ops
      PORT: 3000
      WEB_CONCURRENCY: 2
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: